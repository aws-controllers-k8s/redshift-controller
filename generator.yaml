ignore:
  resource_names:
      - AuthenticationProfile
      - Cluster
      - ClusterParameterGroup
      - ClusterSecurityGroup
      - ClusterSnapshot
      - CustomDomainAssociation
      - EndpointAccess
      - EventSubscription
      - HsmClientCertificate
      - HsmConfiguration
      - Integration
      - Qev2IdcApplication
      - RedshiftIdcApplication
      - ScheduledAction
      - SnapshotCopyGrant
      - SnapshotSchedule
      - UsageLimit
resources:
  ClusterSubnetGroup:
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
        set:
          - ignore: from
      SubnetIDs:
        references:
          service_name: ec2
          resource: Subnet
          path: Status.SubnetID
      Tags:
        custom_sync: {}
    renames:
      operations:
        CreateClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
          output_fields:
            SubnetGroupStatus: Status
        DescribeClusterSubnetGroups:
          input_fields:
            ClusterSubnetGroupName: Name
          output_fields:
            SubnetGroupStatus: Status
        ModifyClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
          output_fields:
            SubnetGroupStatus: Status
        DeleteClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
    exceptions:
      errors:
        404:
          code: ClusterSubnetGroupNotFoundFault
      terminal_codes:
        - InvalidSubnet
    hooks:
      sdk_read_many_post_set_output:
        template_path: hooks/cluster_subnet_group/sdk_read_many_post_set_output.go.tpl
