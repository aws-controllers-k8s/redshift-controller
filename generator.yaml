ignore:
  resource_names:
      - AuthenticationProfile
      - Cluster
      - ClusterParameterGroup
      - ClusterSecurityGroup
      - ClusterSnapshot
      - CustomDomainAssociation
      - EndpointAccess
      - EventSubscription
      - HsmClientCertificate
      - HsmConfiguration
      - Integration
      - Qev2IdcApplication
      - RedshiftIdcApplication
      - ScheduledAction
      - SnapshotCopyGrant
      - SnapshotSchedule
      - UsageLimit
resources:
  ClusterSubnetGroup:
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
      Tags:
        custom_sync: {}
    renames:
      operations:
        CreateClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
        DescribeClusterSubnetGroups:
          input_fields:
            ClusterSubnetGroupName: Name
        ModifyClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
        DeleteClusterSubnetGroup:
          input_fields:
            ClusterSubnetGroupName: Name
    exceptions:
      errors:
        404:
          code: ClusterSubnetGroupNotFoundFault
      terminal_codes:
        - ClusterSubnetGroupQuotaExceeded
        - ClusterSubnetQuotaExceededFault
        - InvalidSubnet
        - ClusterSubnetGroupAlreadyExists
