---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: clusters.redshift.services.k8s.aws
spec:
  group: redshift.services.k8s.aws
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.status
      name: STATUS
      type: string
    - jsonPath: .status.conditions[?(@.type=="ACK.ResourceSynced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster is the Schema for the Clusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterSpec defines the desired state of Cluster.

              Describes a cluster.
            properties:
              allowVersionUpgrade:
                description: |-
                  If true, major version upgrades can be applied during the maintenance window
                  to the Amazon Redshift engine that is running on the cluster.

                  When a new major version of the Amazon Redshift engine is released, you can
                  request that the service automatically apply upgrades during the maintenance
                  window to the Amazon Redshift engine that is running on your cluster.

                  Default: true
                type: boolean
              automatedSnapshotRetentionPeriod:
                description: |-
                  The number of days that automated snapshots are retained. If the value is
                  0, automated snapshots are disabled. Even if automated snapshots are disabled,
                  you can still create manual snapshots when you want with CreateClusterSnapshot.

                  You can't disable automated snapshots for RG or RA3 node types. Set the automated
                  retention period from 1-35 days.

                  Default: 1

                  Constraints: Must be a value from 0 to 35.
                format: int64
                type: integer
              availabilityZone:
                description: |-
                  The EC2 Availability Zone (AZ) in which you want Amazon Redshift to provision
                  the cluster. For example, if you have several EC2 instances running in a
                  specific Availability Zone, then you might want the cluster to be provisioned
                  in the same zone in order to decrease network latency.

                  Default: A random, system-chosen Availability Zone in the region that is
                  specified by the endpoint.

                  Example: us-east-2d

                  Constraint: The specified Availability Zone must be in the same region as
                  the current endpoint.
                type: string
              availabilityZoneRelocation:
                description: |-
                  The option to enable relocation for an Amazon Redshift cluster between Availability
                  Zones after the cluster is created.
                type: boolean
              catalogName:
                description: |-
                  The name of the Glue data catalog that will be associated with the cluster
                  enabled with Amazon Redshift federated permissions.

                  Constraints:

                     * Must contain at least one lowercase letter.

                     * Can only contain lowercase letters (a-z), numbers (0-9), underscores
                     (_), and hyphens (-).

                  Pattern: ^[a-z0-9_-]*[a-z]+[a-z0-9_-]*$

                  Example: my-catalog_01

                  Regex Pattern: `^[a-z0-9_-]*[a-z]+[a-z0-9_-]*$`
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              clusterParameterGroupName:
                description: |-
                  The name of the parameter group to be associated with this cluster.

                  Default: The default Amazon Redshift cluster parameter group. For information
                  about the default parameter group, go to Working with Amazon Redshift Parameter
                  Groups (https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-parameter-groups.html)

                  Constraints:

                     * Must be 1 to 255 alphanumeric characters or hyphens.

                     * First character must be a letter.

                     * Cannot end with a hyphen or contain two consecutive hyphens.
                type: string
              clusterParameterGroupRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                  \ name: my-api"
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              clusterSubnetGroupName:
                description: |-
                  The name of a cluster subnet group to be associated with this cluster.

                  If this parameter is not provided the resulting cluster will be deployed
                  outside virtual private cloud (VPC).
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              clusterSubnetGroupRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                  \ name: my-api"
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              dbName:
                description: |-
                  The name of the first database to be created when the cluster is created.

                  To create additional databases after the cluster is created, connect to the
                  cluster with a SQL client and use SQL commands to create a database. For
                  more information, go to Create a Database (https://docs.aws.amazon.com/redshift/latest/dg/t_creating_database.html)
                  in the Amazon Redshift Database Developer Guide.

                  Default: dev

                  Constraints:

                     * Must contain 1 to 64 alphanumeric characters.

                     * Must contain only lowercase letters.

                     * Cannot be a word that is reserved by the service. A list of reserved
                     words can be found in Reserved Words (https://docs.aws.amazon.com/redshift/latest/dg/r_pg_keywords.html)
                     in the Amazon Redshift Database Developer Guide.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              defaultIAMRoleARN:
                description: |-
                  The Amazon Resource Name (ARN) for the IAM role that was set as default for
                  the cluster when the cluster was created.
                type: string
              defaultIAMRoleRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                  \ name: my-api"
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              elasticIP:
                description: |-
                  The Elastic IP (EIP) address for the cluster.

                  Constraints: The cluster must be provisioned in EC2-VPC and publicly-accessible
                  through an Internet gateway. Don't specify the Elastic IP address for a publicly
                  accessible cluster with availability zone relocation turned on. For more
                  information about provisioning clusters in EC2-VPC, go to Supported Platforms
                  to Launch Your Cluster (https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#cluster-platforms)
                  in the Amazon Redshift Cluster Management Guide.
                type: string
              elasticIPRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                  \ name: my-api"
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              encrypted:
                description: |-
                  If true, the data in the cluster is encrypted at rest. If you set the value
                  on this parameter to false, the request will fail.

                  Default: true
                type: boolean
              enhancedVPCRouting:
                description: |-
                  An option that specifies whether to create the cluster with enhanced VPC
                  routing enabled. To create a cluster that uses enhanced VPC routing, the
                  cluster must be in a VPC. For more information, see Enhanced VPC Routing
                  (https://docs.aws.amazon.com/redshift/latest/mgmt/enhanced-vpc-routing.html)
                  in the Amazon Redshift Cluster Management Guide.

                  If this option is true, enhanced VPC routing is enabled.

                  Default: false
                type: boolean
              extraComputeForAutomaticOptimization:
                description: |-
                  If true, allocates additional compute resources for running automatic optimization
                  operations.

                  Default: false
                type: boolean
              hsmClientCertificateIdentifier:
                description: |-
                  Specifies the name of the HSM client certificate the Amazon Redshift cluster
                  uses to retrieve the data encryption keys stored in an HSM.
                type: string
              hsmConfigurationIdentifier:
                description: |-
                  Specifies the name of the HSM configuration that contains the information
                  the Amazon Redshift cluster can use to retrieve and store keys in an HSM.
                type: string
              iamRoleRefs:
                items:
                  description: "AWSResourceReferenceWrapper provides a wrapper around
                    *AWSResourceReference\ntype to provide more user friendly syntax
                    for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                    \ name: my-api"
                  properties:
                    from:
                      description: |-
                        AWSResourceReference provides all the values necessary to reference another
                        k8s resource for finding the identifier(Id/ARN/Name)
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                      type: object
                  type: object
                type: array
              iamRoles:
                description: |-
                  A list of Identity and Access Management (IAM) roles that can be used by
                  the cluster to access other Amazon Web Services services. You must supply
                  the IAM roles in their Amazon Resource Name (ARN) format.

                  The maximum number of IAM roles that you can associate is subject to a quota.
                  For more information, go to Quotas and limits (https://docs.aws.amazon.com/redshift/latest/mgmt/amazon-redshift-limits.html)
                  in the Amazon Redshift Cluster Management Guide.
                items:
                  type: string
                type: array
              identifier:
                description: |-
                  A unique identifier for the cluster. You use this identifier to refer to
                  the cluster for any subsequent cluster operations such as deleting or modifying.
                  The identifier also appears in the Amazon Redshift console.

                  Constraints:

                     * Must contain from 1 to 63 alphanumeric characters or hyphens.

                     * Alphabetic characters must be lowercase.

                     * First character must be a letter.

                     * Cannot end with a hyphen or contain two consecutive hyphens.

                     * Must be unique for all clusters within an Amazon Web Services account.

                  Example: myexamplecluster
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              ipAddressType:
                description: |-
                  The IP address types that the cluster supports. Possible values are ipv4
                  and dualstack.
                type: string
              kmsKeyID:
                description: |-
                  The Key Management Service (KMS) key ID of the encryption key that you want
                  to use to encrypt data in the cluster.
                type: string
              kmsKeyRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                  \ name: my-api"
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              loadSampleData:
                description: A flag that specifies whether to load sample data once
                  the cluster is created.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              maintenanceTrackName:
                description: |-
                  An optional parameter for the name of the maintenance track for the cluster.
                  If you don't provide a maintenance track name, the cluster is assigned to
                  the current track.
                type: string
              manageMasterPassword:
                description: |-
                  If true, Amazon Redshift uses Secrets Manager to manage this cluster's admin
                  credentials. You can't use MasterUserPassword if ManageMasterPassword is
                  true. If ManageMasterPassword is false or not set, Amazon Redshift uses MasterUserPassword
                  for the admin user account's password.
                type: boolean
              manualSnapshotRetentionPeriod:
                description: |-
                  The default number of days to retain a manual snapshot. If the value is -1,
                  the snapshot is retained indefinitely. This setting doesn't change the retention
                  period of existing snapshots.

                  The value must be either -1 or an integer between 1 and 3,653.
                format: int64
                type: integer
              masterPasswordSecretKMSKeyID:
                description: |-
                  The ID of the Key Management Service (KMS) key used to encrypt and store
                  the cluster's admin credentials secret. You can only use this parameter if
                  ManageMasterPassword is true.
                type: string
              masterPasswordSecretKMSKeyRef:
                description: "AWSResourceReferenceWrapper provides a wrapper around
                  *AWSResourceReference\ntype to provide more user friendly syntax
                  for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                  \ name: my-api"
                properties:
                  from:
                    description: |-
                      AWSResourceReference provides all the values necessary to reference another
                      k8s resource for finding the identifier(Id/ARN/Name)
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    type: object
                type: object
              masterUserPassword:
                description: |-
                  The password associated with the admin user account for the cluster that
                  is being created.

                  You can't use MasterUserPassword if ManageMasterPassword is true.

                  Constraints:

                     * Must be between 8 and 64 characters in length.

                     * Must contain at least one uppercase letter.

                     * Must contain at least one lowercase letter.

                     * Must contain one number.

                     * Can be any printable ASCII character (ASCII code 33-126) except ' (single
                     quote), " (double quote), \, /, or @.
                properties:
                  key:
                    description: Key is the key within the secret
                    type: string
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              masterUsername:
                description: |-
                  The user name associated with the admin user account for the cluster that
                  is being created.

                  Constraints:

                     * Must be 1 - 128 alphanumeric characters or hyphens. The user name can't
                     be PUBLIC.

                     * Must contain only lowercase letters, numbers, underscore, plus sign,
                     period (dot), at symbol (@), or hyphen.

                     * The first character must be a letter.

                     * Must not contain a colon (:) or a slash (/).

                     * Cannot be a reserved word. A list of reserved words can be found in
                     Reserved Words (https://docs.aws.amazon.com/redshift/latest/dg/r_pg_keywords.html)
                     in the Amazon Redshift Database Developer Guide.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              multiAZ:
                description: |-
                  If true, Amazon Redshift will deploy the cluster in two Availability Zones
                  (AZ).
                type: boolean
              nodeType:
                description: |-
                  The node type to be provisioned for the cluster. For information about node
                  types, go to Working with Clusters (https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#how-many-nodes)
                  in the Amazon Redshift Cluster Management Guide.

                  Valid Values: dc2.large | dc2.8xlarge | rg.large | rg.xlarge | rg.4xlarge
                  | rg.12xlarge | ra3.large | ra3.xlplus | ra3.4xlarge | ra3.16xlarge
                type: string
              numberOfNodes:
                description: |-
                  The number of compute nodes in the cluster. This parameter is required when
                  the ClusterType parameter is specified as multi-node.

                  For information about determining how many nodes you need, go to Working
                  with Clusters (https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#how-many-nodes)
                  in the Amazon Redshift Cluster Management Guide.

                  If you don't specify this parameter, you get a single-node cluster. When
                  requesting a multi-node cluster, you must specify the number of nodes that
                  you want in the cluster.

                  Default: 1

                  Constraints: Value must be at least 1 and no more than 100.
                format: int64
                type: integer
              port:
                description: |-
                  The port number on which the cluster accepts incoming connections.

                  The cluster is accessible only via the JDBC and ODBC connection strings.
                  Part of the connection string requires the port on which the cluster will
                  listen for incoming connections.

                  Default: 5439

                  Valid Values:

                     * For clusters with RG or RA3 nodes - Select a port within the ranges
                     5431-5455 or 8191-8215. (If you have an existing cluster with RG or RA3
                     nodes, it isn't required that you change the port to these ranges.)

                     * For clusters with dc2 nodes - Select a port within the range 1150-65535.
                format: int64
                type: integer
              preferredMaintenanceWindow:
                description: |-
                  The weekly time range (in UTC) during which automated cluster maintenance
                  can occur.

                  Format: ddd:hh24:mi-ddd:hh24:mi

                  Default: A 30-minute window selected at random from an 8-hour block of time
                  per region, occurring on a random day of the week. For more information about
                  the time blocks for each region, see Maintenance Windows (https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#rs-maintenance-windows)
                  in Amazon Redshift Cluster Management Guide.

                  Valid Days: Mon | Tue | Wed | Thu | Fri | Sat | Sun

                  Constraints: Minimum 30-minute window.
                type: string
              publiclyAccessible:
                description: |-
                  If true, the cluster can be accessed from a public network.

                  Default: false
                type: boolean
              redshiftIDCApplicationARN:
                description: |-
                  The Amazon resource name (ARN) of the Amazon Redshift IAM Identity Center
                  application.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable once set
                  rule: self == oldSelf
              snapshotScheduleIdentifier:
                description: A unique identifier for the snapshot schedule.
                type: string
              tags:
                description: A list of tag instances.
                items:
                  description: A tag consisting of a name/value pair for a resource.
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                  type: object
                type: array
              type:
                description: |-
                  The type of the cluster. When cluster type is specified as

                     * single-node, the NumberOfNodes parameter is not required.

                     * multi-node, the NumberOfNodes parameter is required.

                  Valid Values: multi-node | single-node

                  Default: multi-node
                type: string
              version:
                description: |-
                  The version of the Amazon Redshift engine software that you want to deploy
                  on the cluster.

                  The version selected runs on all the nodes in the cluster.

                  Constraints: Only version 1.0 is currently available.

                  Example: 1.0
                type: string
              vpcSecurityGroupIDs:
                description: |-
                  A list of Virtual Private Cloud (VPC) security groups to be associated with
                  the cluster.

                  Default: The default VPC security group is associated with the cluster.
                items:
                  type: string
                type: array
              vpcSecurityGroupRefs:
                items:
                  description: "AWSResourceReferenceWrapper provides a wrapper around
                    *AWSResourceReference\ntype to provide more user friendly syntax
                    for references using 'from' field\nEx:\nAPIIDRef:\n\n\tfrom:\n\t
                    \ name: my-api"
                  properties:
                    from:
                      description: |-
                        AWSResourceReference provides all the values necessary to reference another
                        k8s resource for finding the identifier(Id/ARN/Name)
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                      type: object
                  type: object
                type: array
            required:
            - identifier
            - masterUsername
            - nodeType
            type: object
          status:
            description: ClusterStatus defines the observed state of Cluster
            properties:
              ackResourceMetadata:
                description: |-
                  All CRs managed by ACK have a common `Status.ACKResourceMetadata` member
                  that is used to contain resource sync state, account ownership,
                  constructed ARN for the resource
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              availabilityStatus:
                description: |-
                  The availability status of the cluster for queries. Possible values are the
                  following:

                     * Available - The cluster is available for queries.

                     * Unavailable - The cluster is not available for queries.

                     * Maintenance - The cluster is intermittently available for queries due
                     to maintenance activities.

                     * Modifying - The cluster is intermittently available for queries due
                     to changes that modify the cluster.

                     * Failed - The cluster failed and is not available for queries.
                type: string
              availabilityZoneRelocationStatus:
                description: Describes the status of the Availability Zone relocation
                  operation.
                type: string
              catalogARN:
                description: |-
                  The Amazon Resource Name (ARN) of the Glue data catalog associated with the
                  cluster enabled with Amazon Redshift federated permissions.
                type: string
              conditions:
                description: |-
                  All CRs managed by ACK have a common `Status.Conditions` member that
                  contains a collection of `ackv1alpha1.Condition` objects that describe
                  the various terminal states of the CR and its backend AWS service API
                  resource
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration
                        is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              createTime:
                description: The date and time that the cluster was created.
                format: date-time
                type: string
              customDomainCertificateARN:
                description: The certificate Amazon Resource Name (ARN) for the custom
                  domain name.
                type: string
              customDomainCertificateExpiryDate:
                description: |-
                  The expiration date for the certificate associated with the custom domain
                  name.
                format: date-time
                type: string
              customDomainName:
                description: The custom domain name associated with the cluster.
                type: string
              dataTransferProgress:
                description: |-
                  Describes the status of a cluster while it is in the process of resizing
                  with an incremental resize.
                properties:
                  currentRateInMegaBytesPerSecond:
                    type: number
                  dataTransferredInMegaBytes:
                    format: int64
                    type: integer
                  elapsedTimeInSeconds:
                    format: int64
                    type: integer
                  estimatedTimeToCompletionInSeconds:
                    format: int64
                    type: integer
                  status:
                    type: string
                  totalDataInMegaBytes:
                    format: int64
                    type: integer
                type: object
              deferredMaintenanceWindows:
                description: Describes a group of DeferredMaintenanceWindow objects.
                items:
                  description: Describes a deferred maintenance window
                  properties:
                    deferMaintenanceEndTime:
                      format: date-time
                      type: string
                    deferMaintenanceIdentifier:
                      type: string
                    deferMaintenanceStartTime:
                      format: date-time
                      type: string
                  type: object
                type: array
              elasticIPStatus:
                description: The status of the elastic IP (EIP) address.
                properties:
                  elasticIP:
                    type: string
                  status:
                    type: string
                type: object
              elasticResizeNumberOfNodeOptions:
                description: |-
                  The number of nodes that you can resize the cluster to with the elastic resize
                  method.
                type: string
              endpoint:
                description: The connection endpoint.
                properties:
                  address:
                    type: string
                  port:
                    format: int64
                    type: integer
                  vpcEndpoints:
                    items:
                      description: |-
                        The connection endpoint for connecting to an Amazon Redshift cluster through
                        the proxy.
                      properties:
                        networkInterfaces:
                          items:
                            description: Describes a network interface.
                            properties:
                              availabilityZone:
                                type: string
                              ipv6Address:
                                type: string
                              networkInterfaceID:
                                type: string
                              privateIPAddress:
                                type: string
                              subnetID:
                                type: string
                            type: object
                          type: array
                        vpcEndpointID:
                          type: string
                        vpcID:
                          type: string
                      type: object
                    type: array
                type: object
              expectedNextSnapshotScheduleTime:
                description: |-
                  The date and time when the next snapshot is expected to be taken for clusters
                  with a valid snapshot schedule and backups enabled.
                format: date-time
                type: string
              expectedNextSnapshotScheduleTimeStatus:
                description: |-
                  The status of next expected snapshot for clusters having a valid snapshot
                  schedule and backups enabled. Possible values are the following:

                     * OnTrack - The next snapshot is expected to be taken on time.

                     * Pending - The next snapshot is pending to be taken.
                type: string
              hsmStatus:
